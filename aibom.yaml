# Ownership and context that code cannot tell a scanner. Read by the CS54 AI-BOM scanner (phase 2).
app: aibom-lab-sales-sql-assistant
owner: sales-operations-analytics (lab)
business_criticality: medium
environment: lab
exposure: internal
authentication: employee sign-in (simulated by a user name in the request)
autonomy: acts-alone             # generated SQL runs without review, but only as one SELECT under a database authorizer (phase 6)
data_classification:
  sales_db: confidential; salaries table is restricted
identities:
  - name: sales.db connection
    scope: read-only              # phase 6 (PB-09): mode=ro, SELECT-only authorizer
    row_scope: own region only, through a per-session view; salaries denied (phase 6, PB-10)
